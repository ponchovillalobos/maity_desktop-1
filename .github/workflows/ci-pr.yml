name: "CI - Pull Request Smoke Test"

# OPS-001: Ejecuta quality gates en cada Pull Request contra ramas protegidas.
# Propósito: fallar rápido ANTES de mergear si fmt/clippy/tests/lint/typecheck están rotos.
# No firma binarios, no publica artefactos — ese flujo vive en build-windows.yml (workflow_dispatch).

on:
  pull_request:
    branches:
      - main
      - assembly/bootstrap
      - devtest
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust fmt + clippy + test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install LLVM (required by whisper-rs-sys bindgen)
        run: |
          choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: cargo fmt --check
        working-directory: frontend/src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy (best-effort)
        working-directory: frontend/src-tauri
        # No usamos -D warnings aún porque hay 6 warnings pre-existentes
        # tracked en RUST-011 follow-up. Si el clippy mismo falla (error), sí rompe.
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        working-directory: frontend/src-tauri
        run: cargo test --workspace

  frontend-checks:
    name: Frontend lint + typecheck + build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: pnpm run lint
        working-directory: frontend
        run: pnpm run lint
        continue-on-error: true # FE-003 en progreso, best-effort

      - name: pnpm run typecheck
        working-directory: frontend
        run: pnpm run typecheck
        continue-on-error: true # pendiente de endurecerse (FE batch)

      - name: Next.js build
        working-directory: frontend
        run: pnpm run build

  backend-checks:
    name: Backend Python pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install fastapi uvicorn pydantic pytest python-dotenv
          pip install pytest

      - name: Run pytest
        working-directory: backend
        run: pytest tests/ -x --tb=short
        continue-on-error: true # algunos tests requieren DB/env; best-effort por ahora
